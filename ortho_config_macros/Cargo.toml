[package]
name = "ortho_config_macros"
version = "0.10.0"
edition = "2024"
rust-version.workspace = true
readme = "README.md"
description = "Procedural macros for ortho_config."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "visit"] }
ortho_l10n = { path = "../ortho_l10n", version = "0.10.0" }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
heck = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Mirrors optional format parsers in `ortho_config` so
# macro output enables them when selected.
default = []
serde_json = []
json5 = []
yaml = []
toml = []

[dev-dependencies]
anyhow = "1"
rstest = "0.28.0"
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", default-features = false, features = ["test"] }
proptest = "1.11.0"
# Compile-fail coverage for the artefact-lock evidence newtypes. This crate is
# `proc-macro = true`, so the fixtures cannot name the types through it; they
# `#[path]`-include the real source instead. See `tests/evidence_trybuild.rs`.
trybuild = "1"
# `extra-traits` provides `Debug`/`PartialEq` for `syn::Type`, which the parser
# unit tests rely on when asserting on parsed types and failed cases.
syn = { version = "3", features = ["extra-traits"] }
