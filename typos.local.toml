# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  # These code spans name external APIs, identifiers, or deliberate spelling
  # fixtures. Keep inline-code spelling enabled for every other span.
  "`--color auto\\|always\\|never`",
  "`artifact_path`",
  "`color`",
  "`behavior`",
  "`analyzed`",
  "`env\\(allias = …\\)`",
  "flavor = \"current_thread\"",
  "\\bInvoke-ScriptAnalyzer\\b",
  "\\b(?:Invoke-)?PSScriptAnalyzer\\b",
  "localised_help",
  "`Artifacts`",
  "`cargo test -p ortho_config localizer::fluent::tests::normalises_unicode_identifiers`",
  "`cargo test -p hello_world cli::tests::localisation`",
  "`skill_manifest_serialises_with_camino_path`",
  "rust-analyzer",
  "GitHub\\s+Flavored\\s+Markdown",
  "## Artifacts and [Nn]otes",
]

[files]
exclude = [
  ".memdb",
  "scripts/.venv",
]
