# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  # Inline code spans quote identifiers (localised_help, set_color) whose
  # spelling is owned by the code or a third-party API, not the prose.
  "`[^`\\n]+`",
  "rust-analyzer",
  "GitHub\\s+Flavored\\s+Markdown",
  "## Artifacts and [Nn]otes",
]

[files]
exclude = [
  ".memdb",
  "scripts/.venv",
]
