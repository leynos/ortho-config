# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  # Inline code spans hold identifiers, not prose: `color` is a real API
  # name and `localised_help` is a test name. The shared base carried this
  # exclusion until 2026-08-07; it is pinned here so a base refresh cannot
  # silently start spellchecking code. Remove only alongside a sweep of the
  # identifiers it protects.
  "`[^`\\n]+`",
  "rust-analyzer",
  "GitHub\\s+Flavored\\s+Markdown",
  "## Artifacts and [Nn]otes",
]

[files]
exclude = [
  ".memdb",
  "scripts/.venv",
]
