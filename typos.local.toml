# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  # These code spans name external APIs, identifiers, or deliberate spelling
  # fixtures. Keep inline-code spelling enabled for every other span.
  "`--color auto\\|always\\|never`",
  "`artifact_path`",
  "`color`",
  "`behavior`",
  "`analyzed`",
  "`env\\(allias = …\\)`",
  "`#\\[tokio::test\\(flavor = \"current_thread\"\\)\\]`",
  "`Invoke-ScriptAnalyzer`",
  "`PSScriptAnalyzer`",
  "`[^`\\n]*localised_help[^`\\n]*`",
  "`Artifacts`",
  "`[^`\\n]*normalises_unicode_identifiers[^`\\n]*`",
  "`[^`\\n]*cli::tests::localisation[^`\\n]*`",
  "`skill_manifest_serialises_with_camino_path`",
  "rust-analyzer",
  "GitHub\\s+Flavored\\s+Markdown",
  "## Artifacts and [Nn]otes",
  # Short commit abbreviations whose final hex pair happens to spell a word
  # ("59a52ba8" segments as 59a52 + "ba" + 8). Bound to a complete code span
  # so the exception cannot mask prose, and open-ended in length so it covers
  # every abbreviation rather than one SHA at a time.
  "`[0-9a-f]{7,40}`",
]

[files]
exclude = [
  ".memdb",
  "scripts/.venv",
]
