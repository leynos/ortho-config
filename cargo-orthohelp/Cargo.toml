[package]
name = "cargo-orthohelp"
edition = "2024"
version = "0.9.1"
rust-version.workspace = true
description = "OrthoConfig documentation tooling for IR generation."
license.workspace = true
repository.workspace = true

# Resolves prebuilt release archives so `cargo binstall cargo-orthohelp`
# never falls back to compiling from source. The templates must match what
# scripts/release_archive.py produces; tests/workflow_contracts and
# scripts/tests/test_release_archive.py pin both sides together. `{ repo }`
# expands to the workspace `repository` URL and the release tags are `v` +
# the workspace version, so `pkg-url` addresses this repository's releases.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "cargo_orthohelp"
path = "src/lib.rs"

[[bin]]
name = "cargo-orthohelp"
path = "src/main.rs"

[lints]
workspace = true

# Forwarding features mirroring hello_world's: cargo-mutants scopes the
# mutation-testing baseline build to the packages containing a shard's
# mutants, and Cargo resolves the caller's bare feature list against
# the selected packages only, so every mutated workspace member must
# define the CI feature set for the baseline to build (issue #380).
[features]
serde_json = ["ortho_config/serde_json"]
toml = ["ortho_config/toml"]
json5 = ["ortho_config/json5"]
yaml = ["ortho_config/yaml"]

[dependencies]
camino = "1"
cap-std = { version = "4", features = ["fs_utf8"] }
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.18"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
ortho_config = { path = "../ortho_config", version = "0.9.0", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1"
googletest = "0.14"
insta = "1"
proptest = "1"
process-wrap = { version = "9.0.1", default-features = false, features = ["std"] }
pretty_assertions = "1"
rstest = "0.27.0"
rstest-bdd.workspace = true
rstest-bdd-macros.workspace = true
test_helpers = { package = "ortho_config_test_helpers", path = "../test_helpers", version = "0.9.0" }
trybuild = "1"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
