[package]
name = "orthohelp_policy_deny_fixture"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ortho_config = { path = "../../../ortho_config", version = "0.9.0" }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[package.metadata.ortho_config]
root_type = "orthohelp_policy_deny_fixture::SimplePolicyConfig"

[package.metadata.ortho_config.policy]
mode = "deny"

[[package.metadata.ortho_config.policy.exceptions]]
kind = "flag"
name = "bad flag"
reason = "malformed on purpose"