[package]
name = "ortho_l10n"
version = "0.10.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Reusable Fluent localization runtime and message identifier convention."
documentation = "https://docs.rs/ortho_l10n"
keywords = ["localization", "fluent", "i18n"]

[lints]
workspace = true

[dependencies]
fluent-bundle = "0.16.0"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
thiserror = "2"
tracing = "0.1"

[[test]]
name = "boundary"
path = "tests/boundary_tests/mod.rs"

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true
# The boundary contracts render and resolve foreign package roots, so they
# need the same small toolchain the documentation-example harness uses:
# error context, capability-scoped file writes, a deadline-bounded child,
# and TOML rendering for the manifests they write.
anyhow = "1"
cap-std = { version = "4.0.2", features = ["fs_utf8"] }
# Paths inside the fixtures are UTF-8 throughout (they are rendered into
# manifests and compared as crate-root names), so `cap_std::fs_utf8`'s own
# `camino` types are spelled directly rather than converted from `std` paths.
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.0"
wait-timeout = "0.2.1"
