name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Named for the platform, not the runner: the Linux leg's runner
    # follows the event, so a name built from it would differ between a
    # fork's pull request and a branch's, and the required check context
    # would exist on only one of them.
    name: build-test (${{ matrix.platform }})
    # The Linux leg runs on Ubicloud: hosted queue waits on it reached
    # 29 min (median 10 min) over the last ten runs, against a 27 min
    # median wall. A fork's pull request cannot obtain an Ubicloud runner,
    # so it falls back to the hosted label. Windows stays hosted.
    # The Linux leg is sized for disk, not for wall time: on
    # ubicloud-standard-2 it ran out of disk in both runs (36308332712 and
    # 36354295154). The second run started lint with 6,869 MB free and fell
    # to 791 MB during the first coverage pass, even after the discard below.
    # `>-` rather than `>`: a folded scalar keeps a trailing line break
    # inside the expression otherwise.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && matrix.fork-runner || matrix.runner }}
    # Two coverage steps run in this job, each under its own 2,700 s cargo
    # watchdog (RUN_RUST_CARGO_WAIT_TIMEOUT below), so the ceiling must
    # contain both before it contains anything else. On the Windows leg the
    # work outside them, dominated by cache save and restore, reached 3,257 s
    # on run 33447440225, read across 103 jobs of every conclusion. The
    # contract allows 60 minutes for that, making the requirement
    # 5,400 + 3,600 = 9,000 s = 150 minutes, and asks for 15 minutes above it
    # so a ceiling never fires at the moment the watchdog would have
    # reported. The job had no ceiling at all before this and so inherited
    # GitHub's six-hour default.
    timeout-minutes: 165
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # The explicit exclusion of the development build standard (the parallel
      # frontend and mold in `.cargo/config.toml`) from every step that is not
      # a Make gate. Cargo takes RUSTFLAGS in preference to every `rustflags`
      # table in that file, so this value is what keeps the standard out of
      # the coverage builds: cargo-llvm-cov appends `-Cinstrument-coverage` to
      # it, and coverage is measured on the LLVM backend with the platform
      # linker. The Make gates assign RUSTFLAGS themselves and restate the
      # standard, so they ignore this value. It also shields
      # `cargo +1.95.0 install merman-cli`, which reads this checkout's
      # configuration and runs on a stable compiler that refuses `-Zthreads`.
      # Never set it to `''`: an empty value leaves the configuration in force.
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      # generate-coverage kills cargo after RUN_RUST_CARGO_WAIT_TIMEOUT
      # seconds (default 600). The windows coverage run legitimately takes
      # ~12 min (the compile_fail trybuild test alone is ~200s), and the
      # 927edd4 action now emits full per-line data, so raise the ceiling.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '2700'
      # sccache. The shared Rust setup action installs it and, from this
      # pin, exports RUSTC_WRAPPER as the absolute path of the sccache it
      # installed. Before this pin it installed sccache and exported
      # neither the wrapper nor a backend, so every Rust job here paid the
      # install and compiled uncached.
      #
      # RUSTC_WRAPPER is deliberately absent. Setting it by name leaves
      # invocations wrapped by whichever sccache is on PATH, and any that
      # resolve none compile uncached without entering the hit-rate
      # denominator; whitaker #409 measured 69 such invocations. The
      # action stands aside when a caller has already set the variable, so
      # a value here would replace the absolute path with a bare name.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubicloud-standard-4
            fork-runner: ubuntu-latest
            # generate-coverage keys its baseline by `runner.os` and the
            # publisher runs on Linux, so only this leg has a baseline to
            # ratchet against.
            ratchet: true
          - platform: windows
            runner: windows-latest
            fork-runner: windows-latest
            ratchet: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Export the Ubicloud cache credentials
        # The runner hands `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN`
        # to action steps only; this republishes them through `GITHUB_ENV`
        # with the v2 cache-service flag cleared, because Ubicloud's proxy
        # serves v1. Without it the sccache server binds local disk for the
        # whole job. It must precede Setup Rust, which starts that server.
        # On a hosted runner (Windows, or a fork's Linux fallback) there is
        # no proxy and the action fails closed, so it runs on Ubicloud only.
        if: ${{ runner.environment == 'self-hosted' }}
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@6cec89bac47a21cf756d68d638a9a510998e57f8

      - name: Setup Rust
        # `install-mold` puts the pinned, digest-verified mold on PATH on a
        # Linux runner and is a notice-only no-op on Windows, so no `if` is
        # needed and none is allowed: it must precede every step that can
        # reach `make check-build-tools` or run the suite, and the coverage
        # builds below run tests that need it even though their own flags
        # exclude it. The action sets no linker flag; `.cargo/config.toml`
        # selects mold. `mold-version` is held equal to tools/mold/VERSION by
        # tests/workflow_contracts/build_tools_provisioning_test.py.
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          install-mold: 'true'
          mold-version: '2.41.0'

      # The Windows coverage action uses Bash, which prepends Git's /usr/bin
      # ahead of Visual Studio. Pin the linker and export its SDK search paths
      # so nested bridge builds can find MSVC and Windows SDK libraries.
      - name: Configure MSVC for nested Cargo builds
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $installation) {
            throw 'vswhere did not find the Visual Studio C++ toolchain'
          }
          $vsDevCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) {
            throw 'Visual Studio did not provide VsDevCmd.bat'
          }
          $env:MSVC_VSDEVCMD = $vsDevCmd
          $devEnvironment = & $env:COMSPEC /d /s /c 'call "%MSVC_VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set'
          if ($LASTEXITCODE -ne 0) {
            throw 'VsDevCmd.bat could not configure the x64 MSVC environment'
          }
          $toolVariables = @('INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VSCMD_ARG_TGT_ARCH', 'WindowsSdkDir', 'WindowsSDKVersion')
          $selectedVariables = @{}
          foreach ($entry in $devEnvironment) {
            $separator = $entry.IndexOf('=')
            if ($separator -gt 0) {
              $name = $entry.Substring(0, $separator)
              if ($toolVariables -contains $name) {
                $selectedVariables[$name] = $entry.Substring($separator + 1)
              }
            }
          }
          if (-not $selectedVariables.ContainsKey('LIB')) {
            throw 'VsDevCmd.bat did not expose the MSVC library search path'
          }
          $sdkLibraries = $selectedVariables['LIB'] -split ';' | Where-Object { $_ }
          if (-not ($sdkLibraries | Where-Object { Test-Path (Join-Path $_ 'kernel32.lib') })) {
            throw 'VsDevCmd.bat did not expose the Windows SDK kernel32.lib search path'
          }
          foreach ($name in $toolVariables) {
            if ($selectedVariables.ContainsKey($name)) {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$($selectedVariables[$name])" -Encoding utf8
            }
          }
          $linker = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\link.exe' | Select-Object -First 1
          if (-not $linker) {
            throw 'vswhere did not find the x64 MSVC linker'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $linker.Trim()) -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($linker.Trim())" -Encoding utf8

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`. The Markdown check is
        # platform-independent, so it runs on the Linux lane only.
        if: ${{ matrix.platform == 'linux' }}
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          version: "0.6.1"

      - name: Check formatting
        if: ${{ matrix.platform == 'linux' }}
        run: make check-fmt

      - name: Check Rust formatting
        if: ${{ matrix.platform != 'linux' }}
        run: cargo fmt --all -- --check

      - name: Install Mermaid CLI
        shell: bash
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 'latest'

      - name: Install Nixie
        run: uv tool install nixie-cli@1.1.0

      - name: Setup Rust for Merman
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: '1.95.0'

      - name: Install Merman CLI
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Nixie
        run: make nixie

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v20
        with:
          globs: '**/*.md'

      - name: Spelling (en-GB-oxendict)
        run: make spellcheck

      - name: Install Whitaker
        if: ${{ matrix.platform == 'linux' }}
        uses: leynos/shared-actions/.github/actions/install-whitaker@6cec89bac47a21cf756d68d638a9a510998e57f8

      - name: Disk sample (before lint)
        if: ${{ always() && matrix.platform == 'linux' }}
        run: df -BM /

      - name: Lint
        if: ${{ matrix.platform == 'linux' }}
        run: make lint

      # Whitaker lints under its own pinned toolchain on the Linux leg;
      # the Windows leg runs rustdoc and Clippy only.
      - name: Lint (Clippy only)
        if: ${{ matrix.platform != 'linux' }}
        run: make lint-clippy

      - name: Workflow contract tests
        if: ${{ matrix.platform == 'linux' }}
        run: make test-workflow-contracts

      - name: Disk sample (before discard)
        if: ${{ always() && matrix.platform == 'linux' }}
        run: df -BM /

      - name: Discard lint build trees
        # Coverage builds its own tree, so rustdoc's and Clippy's output
        # (debug, doc) and Whitaker's (dylint) go first, about 1 GB on run
        # 36354295154. The registry and sccache are kept. The disk samples
        # around it show the headroom the runner size leaves.
        if: ${{ matrix.platform == 'linux' }}
        run: python3 scripts/discard_build_trees.py target debug doc dylint

      - name: Disk sample (before coverage)
        if: ${{ always() && matrix.platform == 'linux' }}
        run: df -BM /

      - name: Test and Measure Coverage (with serde_saphyr)
        # Broadest feature set, so this leg carries the coverage ratchet
        # (one baseline per job). Ratchet only on the ubuntu leg, which
        # compares against the baseline written by coverage-main.yml.
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: lcov-serde-saphyr.info
          format: lcov
          # `metrics` rides on this leg rather than gaining a job of its own:
          # it is off by default, so without it here the facade code and its
          # tests would never be compiled in CI at all.
          features: serde_json toml json5 yaml metrics
          artefact-name-suffix: serde-saphyr
          with-ratchet: ${{ matrix.ratchet }}
          publish-artefact: 'false'

      - name: Disk sample (after coverage with serde_saphyr)
        if: ${{ always() && matrix.platform == 'linux' }}
        run: df -BM /

      - name: Test and Measure Coverage (without serde_saphyr)
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: lcov-no-serde-saphyr.info
          format: lcov
          features: serde_json toml json5
          artefact-name-suffix: no-serde-saphyr
          publish-artefact: 'false'

      - name: Disk sample (after coverage without serde_saphyr)
        if: ${{ always() && matrix.platform == 'linux' }}
        run: df -BM /

      - name: Merge coverage results
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        # lcov-result-merger takes a single glob pattern and an optional
        # output file; passing two file paths treats the second as the
        # output and leaves stdout empty. Match both feature-leg reports
        # with one glob ('lcov-*.info' excludes the lcov.info output) and
        # write the merged result via stdout.
        run: bun x lcov-result-merger 'lcov-*.info' > lcov.info

      # Invoked through SCCACHE_PATH rather than the bare name, for the same
      # reason RUSTC_WRAPPER is not set by name: a bare `sccache` reports on
      # whichever binary PATH resolves, which may not be the one that did the
      # compiling.
      #
      # No `:-sccache` fallback, deliberately. A default would reintroduce
      # the bare name at exactly the moment it matters, when the setup
      # action has not exported the variable, and the statistics would then
      # describe some other binary while reading as a healthy report. Under
      # `set -u` the unset case fails the step instead, which is the loud
      # answer.
      #
      # Always runs, because the statistics of a failed build are often what
      # explains it.
      - name: Report sccache statistics (build-test)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### sccache (build-test)\n\n'
            printf -- '- backend: %s\n\n' \
              "${{ env.SCCACHE_GHA_ENABLED == 'true' && 'GitHub Actions cache' || 'local disk' }}"
            printf '```\n'
            "${SCCACHE_PATH}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate PowerShell wrapper
        if: ${{ matrix.platform == 'windows' }}
        run: make powershell-wrapper-validate

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          # Skip lading's pre-flight here, and only here. Both
          # `Test and Measure Coverage` steps are unconditional, so every
          # lane reaches this step having already executed this workspace
          # and failed its own lane if anything broke. The pre-flight's
          # cargo check and cargo test would be a second execution of a
          # suite this job has already passed. See leynos/lading#261.
          #
          # Set on the step rather than in lading.toml because a config
          # file cannot tell a CI run from a local one: `make
          # publish-check` on a workstation, where nothing has run the
          # tests first, must still run the full pre-flight.
          #
          # The skip drops the auxiliary builds and the cargo check and
          # test pair, and nothing else. The Cargo.lock freshness guard
          # still runs, and the working-tree guard is unaffected: it is
          # opt-in through `--forbid-dirty` either way. Nor does the skip
          # drop the packaging: `cargo package` still builds each crate
          # from its own packaged sources, which is the only thing here
          # that sees what a published crate exports.
          #
          # `publish_preflight_scope_test.py` pins the premise: both test
          # steps are unconditional and both run ahead of this step.
          LADING_SKIP_PREFLIGHT: 'true'
        run: make publish-check

  # Early-warning job for Clippy lints landing on the Rust beta channel.
  # It is advisory (`continue-on-error`) so new lints surface on the pull
  # request without blocking merges; the pinned-toolchain lint job above
  # remains required. `CARGO="cargo +beta"` overrides the Makefile default
  # with an explicit `+beta` selection, which bypasses the rust-toolchain.toml
  # directory override that would otherwise pin this job to stable.
  #
  # Both operating systems are covered, under `fail-fast: false`, because
  # `make lint-clippy` on Linux and on Windows compile materially
  # different source. `powershell_windows.rs` is gated on `cfg(windows)`
  # and is not compiled at all elsewhere, and the same is true of
  # `cargo_runner.rs`'s MSVC environment decoding. On 2026-09-28 this job
  # failed on four lints in the former — a `Result` predicate and three
  # constant-size chunk iterators — that a Linux-only leg cannot see. One
  # beta is shared by both legs, so the second costs a matrix entry and a
  # machine, not a toolchain download.
  clippy-beta:
    name: Clippy (beta, advisory, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Job-level, so either leg being red leaves the other's result intact
    # and both report. A step-level `continue-on-error` would also swallow
    # a genuine success, and `fail-fast` decides only whether a failing
    # leg cancels its siblings, not whether this job blocks the merge.
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      # Named for the platform, not the runner: the display name has to
      # spell the leg the same way `build-test` does, and a name built
      # from a runner label is one a required context cannot follow.
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust beta with Clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: beta
          components: clippy

      # The header gate above installs the toolchain this job lints with;
      # it does not install the tool that runs the lint. The windows-latest
      # image does currently ship `make` — `build-test`'s Clippy leg calls
      # the same target there — but this job should not read as a lint
      # failure if that stops being true. Chocolatey is the image's own
      # package manager, so the install takes seconds and is a no-op when
      # the package is already present.
      - name: Provision make
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Clippy (beta)
        env:
          CARGO: cargo +beta
          # Beta refuses the nightly-only flag the standard restates (the
          # parallel frontend), so this lane turns the standard off for the
          # whole invocation. That also makes the build-tools
          # preflight a no-op, so the job installs neither mold nor the
          # pinned nightly.
          BUILD_STANDARD: '0'
        run: make lint-clippy

  # Exercises the declared MSRV (`rust-version` in Cargo.toml) and nothing more.
  # The estate's cost rule for this lane is `cargo check --all-targets` on the
  # MSRV toolchain and never a second test run: a test run proves behaviour the
  # `build-test` job has already established on the pinned toolchain, while a
  # check proves that the code still compiles for the oldest compiler the
  # crates promise to support. Version quoted so YAML does not read 1.89.0 as
  # a number. tests/workflow_contracts/build_exclusions_test.py holds it equal
  # to the manifest.
  msrv:
    name: msrv (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # master
        with:
          toolchain: "1.89.0"

      # `make msrv-check` assigns RUSTFLAGS, which displaces the nightly-only
      # flags in `.cargo/config.toml` that a stable compiler refuses, and
      # selects the toolchain with `+1.89.0`, which bypasses the pinned
      # nightly in rust-toolchain.toml.
      - name: Check every target on the MSRV
        run: make msrv-check

  binstall-packaging:
    name: Packaging dry run (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Packaging builds what the release workflow builds, so it takes the
      # release route: production flags only. Assigning RUSTFLAGS displaces
      # the development standard in `.cargo/config.toml` (the parallel
      # frontend and mold). setup-rust would export this same value
      # by default; it is written out so the exclusion does not depend on an
      # action default. Never set it to `''`: an empty value leaves the
      # configuration in force.
      RUSTFLAGS: -D warnings
      # sccache. The shared Rust setup action installs it and, from this
      # pin, exports RUSTC_WRAPPER as the absolute path of the sccache it
      # installed. Before this pin it installed sccache and exported
      # neither the wrapper nor a backend, so every Rust job here paid the
      # install and compiled uncached.
      #
      # RUSTC_WRAPPER is deliberately absent. Setting it by name leaves
      # invocations wrapped by whichever sccache is on PATH, and any that
      # resolve none compile uncached without entering the hit-rate
      # denominator; whitaker #409 measured 69 such invocations. The
      # action stands aside when a caller has already set the variable, so
      # a value here would replace the absolute path with a bare name.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 'latest'

      # Exercises the packaging path the release workflow runs, on each OS
      # family it publishes for, so an archive-layout or sidecar regression
      # fails on the pull request rather than during a release.
      - name: Package the host target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: uv run --script scripts/release_archive.py "$TARGET"

      - name: Verify the archive against the binstall templates
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          uv run --script scripts/verify_release_archives.py --dist-dir dist
          --target "$TARGET"

      # Invoked through SCCACHE_PATH rather than the bare name, for the same
      # reason RUSTC_WRAPPER is not set by name: a bare `sccache` reports on
      # whichever binary PATH resolves, which may not be the one that did the
      # compiling.
      #
      # No `:-sccache` fallback, deliberately. A default would reintroduce
      # the bare name at exactly the moment it matters, when the setup
      # action has not exported the variable, and the statistics would then
      # describe some other binary while reading as a healthy report. Under
      # `set -u` the unset case fails the step instead, which is the loud
      # answer.
      #
      # Always runs, because the statistics of a failed build are often what
      # explains it.
      - name: Report sccache statistics (binstall-packaging)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### sccache (binstall-packaging)\n\n'
            printf -- '- backend: %s\n\n' \
              "${{ env.SCCACHE_GHA_ENABLED == 'true' && 'GitHub Actions cache' || 'local disk' }}"
            printf '```\n'
            "${SCCACHE_PATH}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            suffix=".exe"
          fi
          mkdir -p extracted
          # Globbed rather than derived from the packager's stdout: that path
          # is Windows-flavoured on the windows runner. An empty match would
          # silently skip the smoke test, so the hits are counted.
          shopt -s nullglob
          found=0
          for archive in dist/cargo-orthohelp-"${TARGET}"-v*.tgz; do
            stem="$(basename "${archive}" .tgz)"
            tar -xzf "${archive}" -C extracted
            "extracted/${stem}/cargo-orthohelp${suffix}" orthohelp --help
            found=$((found + 1))
          done

          if [ "${found}" -ne 1 ]; then
            echo "::error::expected exactly one archive for ${TARGET}, found ${found}"
            exit 1
          fi
