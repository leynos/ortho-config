name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    # Two coverage steps run in this job, each under its own 2,700 s cargo
    # watchdog (RUN_RUST_CARGO_WAIT_TIMEOUT below), so the ceiling must
    # contain both before it contains anything else. On the Windows leg the
    # work outside them, dominated by cache save and restore, reached 3,257 s
    # on run 33447440225, read across 103 jobs of every conclusion. The
    # contract allows 60 minutes for that, making the requirement
    # 5,400 + 3,600 = 9,000 s = 150 minutes, and asks for 15 minutes above it
    # so a ceiling never fires at the moment the watchdog would have
    # reported. The job had no ceiling at all before this and so inherited
    # GitHub's six-hour default.
    timeout-minutes: 165
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      # generate-coverage kills cargo after RUN_RUST_CARGO_WAIT_TIMEOUT
      # seconds (default 600). The windows coverage run legitimately takes
      # ~12 min (the compile_fail trybuild test alone is ~200s), and the
      # 927edd4 action now emits full per-line data, so raise the ceiling.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '2700'
      # sccache. The shared Rust setup action installs it and, from this
      # pin, exports RUSTC_WRAPPER as the absolute path of the sccache it
      # installed. Before this pin it installed sccache and exported
      # neither the wrapper nor a backend, so every Rust job here paid the
      # install and compiled uncached.
      #
      # RUSTC_WRAPPER is deliberately absent. Setting it by name leaves
      # invocations wrapped by whichever sccache is on PATH, and any that
      # resolve none compile uncached without entering the hit-rate
      # denominator; whitaker #409 measured 69 such invocations. The
      # action stands aside when a caller has already set the variable, so
      # a value here would replace the absolute path with a bare name.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Checkout
        # fetch-depth: 0 makes the pull request's merge base reachable so the
        # CodeScene changed-line coverage gate (cs-coverage check) can diff
        # against it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0e3c4d24e43aa48b511d94f3b902711eb02138df

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`. The Markdown check is
        # platform-independent, so it runs on the Linux lane only.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          version: "0.6.0"

      - name: Check formatting
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make check-fmt

      - name: Check Rust formatting
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: cargo fmt --all -- --check

      - name: Install Mermaid CLI
        shell: bash
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: 'latest'

      - name: Install Nixie
        run: uv tool install nixie-cli@1.1.0

      - name: Setup Rust for Merman
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: '1.95.0'

      - name: Install Merman CLI
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Nixie
        run: make nixie

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v20
        with:
          globs: '**/*.md'

      - name: Spelling (en-GB-oxendict)
        run: make spellcheck

      - name: Resolve latest Whitaker installer release
        id: whitaker
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api repos/leynos/whitaker/releases/latest --jq '.tag_name')"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Whitaker installer
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ steps.whitaker.outputs.version }}

      - name: Install Whitaker
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          WHITAKER_INSTALLER_VERSION: ${{ steps.whitaker.outputs.version }}
          # binstall reads the release metadata from the GitHub API. Without a
          # token those requests are anonymous and share the runner's IP rate
          # limit with every other job on the fleet, and a 403 sends binstall
          # down the path below. The resolve step above already uses this
          # token for the same API.
          #
          # Carried under a name no tool reads, and assigned to the two
          # binstall commands alone. Named `GH_TOKEN` or `GITHUB_TOKEN`
          # here it would be in the environment of everything else this
          # step runs: the `cargo install` fallback, `whitaker-installer`
          # itself, and every build script either of them executes. The
          # two commands that talk to the GitHub API are the only ones
          # that need it.
          INSTALL_TOKEN: ${{ github.token }}
        run: |
          # `cargo binstall --version` exits non-zero (the flag requires a
          # value), so probe availability with `-V` instead.
          #
          # No `--disable-strategies compile` on this one, deliberately.
          # binstall cannot install whitaker-installer from its release
          # today: it resolves the asset, downloads it, and then reports
          # `bin whitaker-installer is not found`, although the tarball
          # does contain `whitaker-installer-<target>-v<version>/whitaker-installer`,
          # the exact path it names. Until that is understood, the
          # `--locked` source build below it is the only path that
          # works, and it completes: the lockfile keeps cargo-platform
          # off 0.3.3, so the 1.91 requirement never arises. Refusing
          # the fallback here would fail the job on a working lane.
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall -V >/dev/null 2>&1; then
              GH_TOKEN="${INSTALL_TOKEN}" GITHUB_TOKEN="${INSTALL_TOKEN}" \
                cargo binstall --no-confirm --locked \
                "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          # Older whitaker-installer releases probe binstall with the same
          # broken `--version` flag, so their dylint-link fallback compiles
          # from crates.io and needs rustc >= 1.91 — newer than this
          # repository's pinned nightly. Preinstall the prebuilt dylint-link
          # the installer expects so it detects the tool and skips that path.
          #
          # `--disable-strategies compile` is what makes that preinstall
          # dependable. Without it an unreachable release is not an error:
          # binstall falls back to building from source, which is the very
          # thing this line exists to avoid, and the job then fails several
          # minutes later on a rustc version rather than on the download.
          if cargo binstall -V >/dev/null 2>&1; then
            GH_TOKEN="${INSTALL_TOKEN}" GITHUB_TOKEN="${INSTALL_TOKEN}" \
              cargo binstall --no-confirm --disable-strategies compile \
              dylint-link@6.0.1
          fi
          whitaker-installer

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make lint

      # Whitaker lints under its own pinned toolchain on the Linux leg;
      # the Windows leg runs rustdoc and Clippy only.
      - name: Lint (Clippy only)
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: make lint-clippy

      - name: Workflow contract tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make test-workflow-contracts

      - name: Test and Measure Coverage (with serde_saphyr)
        # Broadest feature set, so this leg carries the coverage ratchet
        # (one baseline per job). Ratchet only on the ubuntu leg, which
        # compares against the baseline written by coverage-main.yml.
        uses: leynos/shared-actions/.github/actions/generate-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          output-path: lcov-serde-saphyr.info
          format: lcov
          # `metrics` rides on this leg rather than gaining a job of its own:
          # it is off by default, so without it here the facade code and its
          # tests would never be compiled in CI at all.
          features: serde_json toml json5 yaml metrics
          artefact-name-suffix: serde-saphyr
          with-ratchet: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Test and Measure Coverage (without serde_saphyr)
        uses: leynos/shared-actions/.github/actions/generate-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          output-path: lcov-no-serde-saphyr.info
          format: lcov
          features: serde_json toml json5
          artefact-name-suffix: no-serde-saphyr

      - name: Merge coverage results
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        # lcov-result-merger takes a single glob pattern and an optional
        # output file; passing two file paths treats the second as the
        # output and leaves stdout empty. Match both feature-leg reports
        # with one glob ('lcov-*.info' excludes the lcov.info output) and
        # write the merged result via stdout.
        run: bun x lcov-result-merger 'lcov-*.info' > lcov.info

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: >-
          env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu-latest'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/69279
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      # Invoked through SCCACHE_PATH rather than the bare name, for the same
      # reason RUSTC_WRAPPER is not set by name: a bare `sccache` reports on
      # whichever binary PATH resolves, which may not be the one that did the
      # compiling.
      #
      # No `:-sccache` fallback, deliberately. A default would reintroduce
      # the bare name at exactly the moment it matters, when the setup
      # action has not exported the variable, and the statistics would then
      # describe some other binary while reading as a healthy report. Under
      # `set -u` the unset case fails the step instead, which is the loud
      # answer.
      #
      # Always runs, because the statistics of a failed build are often what
      # explains it.
      - name: Report sccache statistics (build-test)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### sccache (build-test)\n\n'
            printf -- '- backend: %s\n\n' \
              "${{ env.SCCACHE_GHA_ENABLED == 'true' && 'GitHub Actions cache' || 'local disk' }}"
            printf '```\n'
            "${SCCACHE_PATH}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate PowerShell wrapper
        if: ${{ matrix.os == 'windows-latest' }}
        run: make powershell-wrapper-validate

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: make publish-check

  binstall-packaging:
    name: Packaging dry run (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # sccache. The shared Rust setup action installs it and, from this
      # pin, exports RUSTC_WRAPPER as the absolute path of the sccache it
      # installed. Before this pin it installed sccache and exported
      # neither the wrapper nor a backend, so every Rust job here paid the
      # install and compiled uncached.
      #
      # RUSTC_WRAPPER is deliberately absent. Setting it by name leaves
      # invocations wrapped by whichever sccache is on PATH, and any that
      # resolve none compile uncached without entering the hit-rate
      # denominator; whitaker #409 measured 69 such invocations. The
      # action stands aside when a caller has already set the variable, so
      # a value here would replace the absolute path with a bare name.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0e3c4d24e43aa48b511d94f3b902711eb02138df

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: 'latest'

      # Exercises the packaging path the release workflow runs, on each OS
      # family it publishes for, so an archive-layout or sidecar regression
      # fails on the pull request rather than during a release.
      - name: Package the host target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: uv run --script scripts/release_archive.py "$TARGET"

      - name: Verify the archive against the binstall templates
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          uv run --script scripts/verify_release_archives.py --dist-dir dist
          --target "$TARGET"

      # Invoked through SCCACHE_PATH rather than the bare name, for the same
      # reason RUSTC_WRAPPER is not set by name: a bare `sccache` reports on
      # whichever binary PATH resolves, which may not be the one that did the
      # compiling.
      #
      # No `:-sccache` fallback, deliberately. A default would reintroduce
      # the bare name at exactly the moment it matters, when the setup
      # action has not exported the variable, and the statistics would then
      # describe some other binary while reading as a healthy report. Under
      # `set -u` the unset case fails the step instead, which is the loud
      # answer.
      #
      # Always runs, because the statistics of a failed build are often what
      # explains it.
      - name: Report sccache statistics (binstall-packaging)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### sccache (binstall-packaging)\n\n'
            printf -- '- backend: %s\n\n' \
              "${{ env.SCCACHE_GHA_ENABLED == 'true' && 'GitHub Actions cache' || 'local disk' }}"
            printf '```\n'
            "${SCCACHE_PATH}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            suffix=".exe"
          fi
          mkdir -p extracted
          # Globbed rather than derived from the packager's stdout: that path
          # is Windows-flavoured on the windows runner. An empty match would
          # silently skip the smoke test, so the hits are counted.
          shopt -s nullglob
          found=0
          for archive in dist/cargo-orthohelp-"${TARGET}"-v*.tgz; do
            stem="$(basename "${archive}" .tgz)"
            tar -xzf "${archive}" -C extracted
            "extracted/${stem}/cargo-orthohelp${suffix}" orthohelp --help
            found=$((found + 1))
          done

          if [ "${found}" -ne 1 ]; then
            echo "::error::expected exactly one archive for ${TARGET}, found ${found}"
            exit 1
          fi
