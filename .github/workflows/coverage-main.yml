name: Coverage (main)

# The single publisher. CodeScene accepts `cs-coverage upload` only for
# analysed branches, and this workflow is the one place in the
# repository that runs a CodeScene action at all: no workflow serving
# pull requests names one, receives `CS_ACCESS_TOKEN`, or invokes
# `cs-coverage`.
#
# That is a policy rather than a gap. A pull request from a fork cannot
# read the token, so the changed-line gate there was a silent skip for
# exactly the contributions least likely to have been measured; and on a
# branch it put a second tool on the critical path for a gate the
# ratchet already applies. `tests/workflow_contracts/codescene_coverage_test.py`
# holds the shape.
#
# This workflow also advances the coverage ratchet baseline: caches
# saved on main are readable by every pull-request run, so the baseline
# written here is the one every pull request's ratchet compares against.
# ci.yml's generate-coverage selection therefore has to match the legs
# below field for field.

on:
  push:
    branches: [main]

# One publisher run at a time, and a superseded one queues rather than
# being cancelled. The baseline this workflow writes is what every pull
# request ratchets against, so two runs racing would decide it by which
# finished last. A cancelled run abandons both its upload and its
# baseline write; a queued one publishes later, and the later push's
# baseline still wins because it runs last.
concurrency:
  group: coverage-main
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # Two coverage steps run in this job, each under its own 2,700 s cargo
    # watchdog (RUN_RUST_CARGO_WAIT_TIMEOUT below), so the ceiling must
    # contain both. The work outside them reached 284 s on run 31908409573,
    # read across 31 runs of every conclusion, and the contract allows 15
    # minutes against that, which makes the requirement
    # 5,400 + 900 = 6,300 s = 105 minutes with 15 more asked for above it.
    # This job had no ceiling either.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      # generate-coverage kills cargo after RUN_RUST_CARGO_WAIT_TIMEOUT
      # seconds (default 600); the full-suite coverage run needs longer.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '2700'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a5765019912a8ab6882b12db049c7cde635f3a85

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Test and Measure Coverage (with serde_saphyr)
        # Broadest feature set, so this leg carries the coverage ratchet
        # (one baseline per job); it writes the authoritative baseline that
        # pull-request runs compare against.
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: lcov-serde-saphyr.info
          format: lcov
          # `metrics` matches the pull-request lane's leg of the same
          # name. The ratchet compares a pull request's report against
          # the baseline this step writes, so a feature compiled on one
          # side and not the other makes that comparison measure the
          # difference between two builds: every line of the metrics
          # facade read as newly uncovered against a baseline that never
          # compiled it.
          features: serde_json toml json5 yaml metrics
          artefact-name-suffix: serde-saphyr-main
          with-ratchet: 'true'

      - name: Test and Measure Coverage (without serde_saphyr)
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: lcov-no-serde-saphyr.info
          format: lcov
          features: serde_json toml json5
          artefact-name-suffix: no-serde-saphyr-main

      - name: Merge coverage results
        shell: bash
        # lcov-result-merger takes a single glob pattern and an optional
        # output file; passing two file paths treats the second as the
        # output and leaves stdout empty. Match both feature-leg reports
        # with one glob ('lcov-*.info' excludes the lcov.info output) and
        # write the merged result via stdout.
        run: bun x lcov-result-merger 'lcov-*.info' > lcov.info

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # The ref as well as the token. This workflow declares no
        # `workflow_dispatch` today, so `github.ref` is always main and
        # the guard changes nothing now; it is here because a dispatch
        # can be aimed at any branch and the upload carries no ref, so
        # adding one later would otherwise let a run from a feature
        # branch publish that branch's coverage as the trunk's, with
        # nothing reporting it.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: lcov
          # Named rather than left to the action's default, because this
          # is the one workflow allowed to upload and a reader of these
          # lines should not have to look the default up to know that.
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          # No checksum input. `installer-checksum` is rejected outright
          # when non-empty from this pin, and `archive-checksum` is not a
          # rename of it: it digests the action's CLI manifest archive,
          # while `CODESCENE_CLI_SHA256` holds the installer script's
          # digest, so carrying the value across under the new name
          # would fail every run. The action pins the CLI through its
          # own manifest now, which is what that variable stood in for.
