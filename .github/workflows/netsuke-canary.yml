name: Netsuke v0.1.0 release-admission canary

on:
  push:
    branches: [issue-598-v010-netsuke-canary]
  workflow_dispatch:

jobs:
  canary:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: check-fmt
          - os: ubuntu-latest
            target: lint
          - os: ubuntu-latest
            target: test
          - os: ubuntu-latest
            target: markdownlint
          - os: ubuntu-latest
            target: generated-config
          - os: windows-latest
            target: powershell-wrapper-validate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: leynos/shared-actions/.github/actions/setup-rust@f4764bea8d813b1a8f7ebc37a44907d3c3b1e0e4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.2.21'
      - name: Install Markdown lint
        shell: bash
        run: bun install --global markdownlint-cli2@0.22.0
      - name: Install Whitaker
        if: matrix.target == 'lint'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked whitaker-installer
          whitaker-installer
      - name: Install the pinned Netsuke candidate
        id: netsuke
        uses: leynos/netsuke/.github/actions/install-release-candidate@ba0f87cd9e518ed81a5eb32709d8f2a65dae4124
        with:
          revision: ba0f87cd9e518ed81a5eb32709d8f2a65dae4124
          expected-version: 0.1.0-beta2
      - name: Run the selected mixed-tool gate
        shell: bash
        run: |
          set +e
          "${{ steps.netsuke.outputs.binary }}" build "${{ matrix.target }}"
          status=$?
          printf '{"repository":"leynos/ortho-config","downstream_revision":"%s","netsuke_revision":"%s","netsuke_version":"%s","target":"%s","platform":"%s","status":%s}\n' \
            "$GITHUB_SHA" "${{ steps.netsuke.outputs.revision }}" "${{ steps.netsuke.outputs.version }}" "${{ matrix.target }}" "$RUNNER_OS" "$status"
          exit "$status"
