# The development build standard, as Cargo's auto-discovered defaults.
#
# A bare `cargo build`, `cargo test` or `cargo check` reads this file, so the
# standard is what a contributor gets without asking for it. The Makefile
# restates the same flags where a recipe assigns `RUSTFLAGS`
# (docs/developers-guide.md, "Development build standard");
# tests/workflow_contracts/build_standard_routing_test.py holds the two equal
# for every host it names.
#
# - `-Zthreads=8` is the parallel `rustc` frontend. It is nightly-only, which
#   is why rust-toolchain.toml pins a dated nightly.
# - Development builds use LLVM, the estate standard. The opt-in lines below
#   select the Cranelift backend (`-Zcodegen-backend=cranelift`) and define the
#   `ortho_config_dev_fast` cfg, which ignores the unwind-dependent tests that
#   Cranelift cannot run; the `--check-cfg` line keeps the cfg name registered.
#   Cranelift cannot unwind through compiled frames. Opt-in via
#   `--config 'build.rustflags=[...]'` is not supported: uncomment both blocks.
# - `-Clink-arg=-fuse-ld=mold` selects the `mold` linker. `mold` ships for Linux
#   only, so it appears solely under the Linux target table, never in `[build]`
#   and never under `cfg(unix)`, which macOS builds also take.
#
# Cargo selects ONE `rustflags` source and does not merge them: a matching
# `[target.*]` table replaces `[build] rustflags` outright, and an assigned
# `RUSTFLAGS` outranks every table here. So every flag that must survive is
# repeated in each source, except the ones deliberately scoped to a platform.
# Release, coverage and the Whitaker suite take none of this; they assign
# `RUSTFLAGS` and say so where they do.

[build]
rustflags = [
  "-Zthreads=8",
  # Cranelift disabled estate-wide on 14 November 2026 (concordat ADR; review 14 May 2027). Uncomment to opt back in.
  # "-Zcodegen-backend=cranelift",
  # "--cfg=ortho_config_dev_fast",
  "--check-cfg=cfg(ortho_config_dev_fast)",
]

[target.'cfg(target_os = "linux")']
rustflags = [
  "-Zthreads=8",
  # Cranelift disabled estate-wide on 14 November 2026 (concordat ADR; review 14 May 2027). Uncomment to opt back in.
  # "-Zcodegen-backend=cranelift",
  # "--cfg=ortho_config_dev_fast",
  "--check-cfg=cfg(ortho_config_dev_fast)",
  "-Clink-arg=-fuse-ld=mold",
]
