[package]
name = "ortho_config_test_helpers"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared test helpers for crates in the ortho-config workspace."
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
cap-std = { version = "4.0.2", features = ["fs_utf8"] }
camino = "1"
figment = { version = "0.10", default-features = false, features = ["env", "test"] }
parking_lot = "0.12"
process-wrap = { version = "9.0.1", default-features = false, features = ["std"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
proptest = "1.11.0"
