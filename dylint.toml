# Configuration for the Whitaker Dylint suite (see `make lint-whitaker`).

[no_std_fs_operations]
excluded_paths = [
    # Boundary-probe liveness check: a descendant teaches its parent that it
    # is alive by holding an exclusive operating-system file lock, which the
    # kernel releases however the process dies. cap-std exposes no locking
    # API, so this one module uses std::fs; the only file it touches is the
    # probe's own lock file in the scratch directory its parent supplied.
    "boundary::boundary::fixture_cargo::process::probe_support::descendant_lock",
    # Packaging lease: `cargo package --verify` is expensive enough that each
    # nextest test process re-running it turns one packaged set into twelve
    # sequential invocations. The lease is an exclusive operating-system file
    # lock taken for the packaging step, which cap-std cannot express; the only
    # file it touches is its own lease inside the boundary's private packaging
    # target, and the only thing it protects is that target.
    "boundary::boundary::package_set::lease",
    # Boundary run guard: the second half of the same problem. The lease is
    # released before a contract reads the roots, so a second boundary run could
    # replace them mid-read; this guard excludes overlapping runs by holding an
    # exclusive operating-system file lock for a process's whole life, which
    # cap-std cannot express. Same terms as the lease: the only file it touches
    # is its own guard in the boundary's private tree, and the only thing it
    # protects is that checkout.
    "boundary::boundary::package_set::run_guard",
    # Identifier-artefact whole-test lease: a fixed fixture target is shared
    # state, so the test must hold an exclusive operating-system file lock for
    # its whole lifetime to keep another test process from cleaning the target
    # mid-build. cap-std exposes no locking API; the locked file is the
    # fixture's own lease file inside its private target.
    "identifier_artefact_e2e::identifier_artefact_e2e_support::lease",
]
excluded_crates = [
    # Configuration discovery library: its contract is to resolve and read
    # configuration from ambient locations (current directory, home, and
    # XDG paths supplied by the user or environment), so there is no
    # capability root to thread through. Unit tests stage config trees in
    # ambient temp directories to exercise the same discovery paths.
    "ortho_config",
    # The procedural macro writes an explicitly requested, Cargo-scoped
    # identifier artefact below OUT_DIR; it has no capability root to receive.
    "ortho_config_macros",
    # Integration test crate (ortho_config/tests/discovery_attributes.rs):
    # stages configuration trees in ambient temp directories so the derive
    # macro's discovery attributes resolve them exactly as end users would.
    "discovery_attributes",
    # Cargo subcommand binary: operates on the ambient cargo workspace,
    # target directory, and bridge scratch space that `cargo` itself
    # resolves ambiently; its tests stage the same ambient layouts.
    "cargo_orthohelp",
]
